# Harvest pool: DigitalNZ search (url + params) plus include/exclude criteria.
# Exact exclude values are sent as without[] prefilters; globs and title
# substrings are applied when sampling partners / checking records.
# Patterns are exact (case-insensitive) or globs (* and ?).
shared:
  url: https://digitalnz.org/records
  params:
    "i[category]": Images
    "i[usage]":
      - Modify
      - Use commercially

  include:
    partners:
      - "*Council*"
      - "*Museum*"
      - "*Library*"
      - "*Libraries*"
      - MOTAT
      - Puke Ariki

  exclude:
    partners:
      - The British Library
      - Museums Victoria
      - Australian National Maritime Museum
      - National Library of New Zealand
      - Digital Public Library of America
      - "*University*"
      - "*Theological*"
      - "*College*"
      - "*Parliamentary*"
      - "*State Library*"
    subjects:
      - Portraits
      - portraits
      - studio portraits
      - Group portraits
      - people
      - Men
      - Women
      - Children
      - "*colour*"
      - "*color*"
    types:
      - Transparency
      - Photograph slide
      - Map
      - Poster
      - Specimen
      - Art work
      - Card
      - "*portrait*"
    title_contains:
      - portrait
      - colour
      - color
