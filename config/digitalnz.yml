# Harvest pool is this DigitalNZ search (the part after ?; a full URL also works).
# Partner globs cannot go in the query — the API has no content_partner wildcard —
# so include.partners is applied when sampling facets. Empty include = all partners.
shared:
  query: "i[category]=Images&i[usage][]=Modify&i[usage][]=Use+commercially&without[subject][]=Portraits&without[subject][]=studio+portraits&without[subject][]=Group+portraits&without[subject][]=people&without[subject][]=Men&without[subject][]=Women&without[subject][]=Children&without[content_partner][]=The+British+Library&without[content_partner][]=National+Library+of+New+Zealand&without[content_partner][]=Digital+Public+Library+of+America&without[content_partner][]=Museums+Victoria&without[content_partner][]=Australian+National+Maritime+Museum&without[content_partner][]=State+Library+of+Victoria&without[content_partner][]=State+Library+of+New+South+Wales&without[content_partner][]=John+Kinder+Theological+Library"

  include:
    partners:
      - "*Council*"
      - "*Museum*"
      - "*Library*"
      - "*Libraries*"
      - MOTAT
      - Puke Ariki
