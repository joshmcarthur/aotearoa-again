# Harvest pool. `query` is the DigitalNZ search string (the part after ?).
# A full website or API URL also works. include/exclude are applied on top
# with standard whitelist then blacklist rules. Patterns may be exact
# (case-insensitive) or globs (* and ?).
#
#   i[category]=Images&i[usage][]=Modify&i[usage][]=Use+commercially
#   and[category][]=Images&and[usage][]=Modify
shared:
  query: "i[category]=Images&i[usage][]=Modify&i[usage][]=Use+commercially"

  include:
    partners:
      - "*Council*"
      - "*Museum*"
      - "*Library*"
      - "*Libraries*"
      - MOTAT
      - Puke Ariki

  exclude:
    partners:
      - The British Library
      - Museums Victoria
      - Australian National Maritime Museum
      - National Library of New Zealand
      - Digital Public Library of America
      - "*University*"
      - "*Theological*"
      - "*College*"
      - "*Parliamentary*"
      - "*State Library*"
    subjects:
      - Portraits
      - portraits
      - studio portraits
      - Group portraits
      - people
      - Men
      - Women
      - Children
      - "*colour*"
      - "*color*"
    types:
      - Transparency
      - Photograph slide
      - Map
      - Poster
      - Specimen
      - Art work
      - Card
      - "*portrait*"
    title_contains:
      - portrait
      - colour
      - color
